<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{#insert title}Framework Features Registry{/insert}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.cyan.min.css">
    <style>
        table { font-size: 0.875rem; }
        .stats { display: flex; gap: 1.5rem; margin-bottom: 1rem; }
        .stats a { padding: 0.25rem 0.75rem; border-radius: 4px; background: var(--pico-card-background-color); text-decoration: none; cursor: pointer; }
        .stats a:hover { filter: brightness(0.9); }
        .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
        .actions a[role="button"], .actions button { font-size: 0.875rem; padding: 0.3rem 0.8rem !important; margin-bottom: 0; line-height: 1.4; }
        .gap { color: var(--pico-del-color); font-weight: 600; }
        .matched { color: var(--pico-ins-color); }
        .badge { font-size: 0.75rem; padding: 0.1rem 0.4rem; border-radius: 3px; }
        .badge-yes { background: #6db33f; color: white; }
        .badge-no { background: var(--pico-del-color); color: white; }
        .flash { padding: 0.75rem; margin-bottom: 1rem; border-radius: 4px; background: var(--pico-ins-color); color: white; }
        .badge-status { font-size: 0.7rem; padding: 0.1rem 0.4rem; border-radius: 3px; color: white; }
        .badge-status-to-develop { background: #e67e22; }
        .badge-status-no-action { background: #95a5a6; }
        .badge-status-approved { background: #3498db; }
        .badge-status-in-progress { background: #9b59b6; }
        .badge-status-done { background: #27ae60; }
        {#insert extraStyles}{/insert}
    </style>
</head>
<body>
<header class="container">
    <nav>
        <ul></ul>
        <ul>
            <li><a href="/registry" role="button" class="outline" style="font-size:0.875rem;padding:0.3rem 0.8rem;margin:0;">Registry</a></li>
            <li><a href="/capabilities" role="button" class="outline" style="font-size:0.875rem;padding:0.3rem 0.8rem;margin:0;">Capabilities</a></li>
            <li><form method="post" action="/save" style="margin:0;"><button type="submit" class="outline" style="font-size:0.875rem;padding:0.3rem 0.8rem;margin:0;">Save to YAML</button></form></li>
        </ul>
    </nav>
</header>
<main class="container">
    {#insert content}{/insert}
</main>
<script>
{#insert extraScripts}{/insert}
</script>
</body>
</html>
