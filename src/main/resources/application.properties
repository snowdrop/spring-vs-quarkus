quarkus.application.name=spring-vs-quarkus

# Workaround for Java 25 + Byte Buddy compatibility
quarkus.native.additional-build-args=-Dnet.bytebuddy.experimental=true
quarkus.http.port=8080

# H2 in-memory database
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:cartography;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# Schema recreated on each startup; data comes from YAML file
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Jackson
quarkus.jackson.fail-on-unknown-properties=false

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.snowdrop".level=DEBUG
